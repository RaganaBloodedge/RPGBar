<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPGBar · 古堡秘宝</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 加入画面 -->
<section id="join-screen" class="screen">
  <div class="join-card">
    <div class="logo">
      <span class="logo-die">⚄</span>
      <h1>RPGBar</h1>
      <p class="tagline">多人联机文字跑团 · Agent 当 DM</p>
    </div>
    <form id="join-form">
      <label>你的名字</label>
      <input id="join-name" type="text" placeholder="例如：亚瑟" autocomplete="off" required>

      <label>角色职业</label>
      <select id="join-class">
        <option value="战士">战士 · 力量型</option>
        <option value="法师">法师 · 施法者</option>
        <option value="游侠">游侠 · 敏捷型</option>
        <option value="盗贼">盗贼 · 巧手型</option>
      </select>

      <label>房间码（留空自动建房，也可输入朋友的房间码加入）</label>
      <input id="join-room" type="text" placeholder="留空新建，或输入如 ABC12" autocomplete="off">

      <button type="submit" class="btn primary">进入古堡</button>
    </form>
    <p class="hint">开多个标签页、或让朋友连你的局域网 IP，输入同一房间码即可联机。</p>
  </div>
</section>

<!-- 游戏画面 -->
<section id="game-screen" class="screen hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo-die">⚄</span>
      <span class="brand-name">RPGBar · 古堡秘宝</span>
    </div>
    <div class="room-info">
      <span class="chip">房间 <b id="room-code">—</b></span>
      <span class="chip">场景 <b id="scene-title">—</b></span>
      <span class="chip">地点 <b id="scene-location">—</b></span>
      <button id="copy-room" class="btn ghost" title="复制房间码">复制房间码</button>
    </div>
  </header>

  <main class="layout">
    <section class="log-panel">
      <div id="log" class="log"></div>
    </section>

    <aside class="sidebar">
      <h2>队伍</h2>
      <ul id="players" class="players"></ul>

      <h2>已获得线索</h2>
      <ul id="flags" class="flags"></ul>

      <h2>掷骰</h2>
      <button id="roll-d20" class="btn dice-btn">掷 d20</button>
      <p class="hint small">检定的骰子会由 DM 在触发时自动投掷</p>
    </aside>
  </main>

  <footer class="composer">
    <div id="suggestions" class="suggestions"></div>
    <div class="composer-row">
      <button id="suggest-btn" class="btn ghost">助手建议</button>
      <input id="action-input" type="text" placeholder="描述你的行动，例如：说服老周 / 调查挂毯 / 推开铁门进入门厅" autocomplete="off">
      <button id="send-btn" class="btn primary">行动</button>
    </div>
  </footer>
</section>

<script src="app.js"></script>
</body>
</html>
